[package]
name = "veclin_greedy_extension"
version = "1.0.0"
edition = "2021"

[lib]
name = "veclin_greedy_extension"
crate-type = ["cdylib"]

[[bin]]
name = "greedy_extention"
path = "src/main.rs"

[dependencies]
pyo3 = { version = "0.24.0", features = ["extension-module"] }
itertools = "0.10"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "1.1"
